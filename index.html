          tag_farmer: "पशुपालक",
          tag_admin: "प्रशासक"

      };

      // Toast Dispatcher
      function showToast(msg, type = "info") {
        const c = document.getElementById("toastContainer");
        if (!c) return;
        const t = document.createElement("div");
        t.className = "pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg text-xs font-semibold backdrop-blur-md transition-all duration-300 transform translate-y-2";
        if (type === "success") {
          t.className += " bg-emerald-50 border-emerald-300 text-emerald-900";
          t.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i><span>' + msg + '</span>';
        } else if (type === "error") {
          t.className += " bg-rose-50 border-rose-300 text-rose-900";
          t.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-600 text-sm"></i><span>' + msg + '</span>';
        } else {
          t.className += " bg-sky-50 border-sky-300 text-sky-900";
          t.innerHTML = '<i class="fa-solid fa-circle-info text-sky-600 text-sm"></i><span>' + msg + '</span>';
        }
        c.appendChild(t);
        requestAnimationFrame(() => t.classList.remove("translate-y-2"));
        setTimeout(() => {
          t.classList.add("opacity-0", "translate-y-2");
          setTimeout(() => t.remove(), 250);
        }, 3200);
      }

      // Drawer Open / Close Logic
      const drawerNav = document.getElementById("drawerNav");
      const drawerBackdrop = document.getElementById("drawerBackdrop");
      const btnOpenDrawer = document.getElementById("btnOpenDrawer");
      const btnCloseDrawer = document.getElementById("btnCloseDrawer");

      function openDrawer() {
        drawerBackdrop.classList.remove("hidden");
        requestAnimationFrame(() => {
          drawerBackdrop.classList.remove("opacity-0");
          drawerNav.classList.remove("-translate-x-full");
        });
      }

      function closeDrawer() {
        drawerBackdrop.classList.add("opacity-0");
        drawerNav.classList.add("-translate-x-full");
        setTimeout(() => drawerBackdrop.classList.add("hidden"), 300);
      }

      btnOpenDrawer.addEventListener("click", openDrawer);
      btnCloseDrawer.addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);

      // Drawer Role Menus Catalog
      const ROLE_MENUS = {
        doctor: [
          { id: "opd-pad", icon: "fa-prescription", title: "डिजिटल ओपीडी पर्ची", en: "Digital Prescription" },

        ],
        farmer: [
          { id: "pashu-passbook", icon: "fa-id-card", title: "पशु आधार पासबुक", en: "Pashu Aadhaar Passbook" },
          { id: "milk-ledger", icon: "fa-bucket", title: "दूध व फैट-एसएनएफ खाता", en: "Milk & Fat Payout Calc" },
          { id: "desi-nuskhe", icon: "fa-leaf", title: "देसी आयुर्वेदिक नुस्खे", en: "Desi Ethno-Vet Nuskhe" },
          { id: "breeding-cycle", icon: "fa-calendar-heart", title: "मद व गर्भ चक्र ट्रैकर", en: "Heat & Pregnancy Calendar" },
          { id: "feed-ration", icon: "fa-wheat-awn", title: "चारा संतुलन कैलकुलेटर", en: "Feed Ration Balancer" },

      // Populate Drawer Menu Based on Active Role
      function renderDrawerMenu() {
        const container = document.getElementById("drawerMenuList");
        if (!container) return;

        const items = ROLE_MENUS[AppState.role] || ROLE_MENUS.doctor;
        const currentLang = AppState.lang;

        container.innerHTML = items.map(item => `
          <button type="button" data-view="${item.id}" class="drawer-nav-item w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-left text-xs font-semibold transition-all ${AppState.currentView === item.id ? 'bg-sky-50 text-sky-700 font-bold border border-sky-100' : 'text-slate-700 hover:bg-slate-100/80'}">
            <div class="w-7 h-7 rounded-lg ${AppState.currentView === item.id ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-xs">
              <i class="fa-solid ${item.icon}"></i>
            </div>
            <div class="flex-1 truncate">
              <div class="truncate text-slate-900">${item.title}</div>
              <div class="text-[10px] text-slate-400 font-mono truncate">${item.en}</div>
            </div>
          </button>
        `).join("");

        // Attach event listeners to items
        container.querySelectorAll(".drawer-nav-item").forEach(btn => {
          btn.addEventListener("click", () => {
            const view = btn.getAttribute("data-view");
            AppState.currentView = view;
            closeDrawer();
            renderWorkspaceView(view);
            renderDrawerMenu();
          });
        });

        // Update profile box in drawer
        const nameEl = document.getElementById("drawerUserName");
        const subEl = document.getElementById("drawerUserSubtitle");
        const badgeEl = document.getElementById("drawerUserBadge");
        const avatarEl = document.getElementById("drawerUserAvatar");
        const headerAvatar = document.getElementById("headerAvatarText");

      // Main Workspace Renderer
      function renderWorkspaceView(viewId) {
        const root = document.getElementById("app-root");
        if (!root) return;

        if (typeof ViewComponents[viewId] === "function") {
          root.innerHTML = ViewComponents[viewId]();
        } else {
          root.innerHTML = ViewComponents.dashboard();
        }

        window.scrollTo({ top: 0, behavior: "smooth" });

        // Bind interactive elements inside newly injected view
        bindViewEvents();
      }

      // Event Bindings for Inside Views
      function bindViewEvents() {
        // Jump cards (internal view navigation)
        document.querySelectorAll("[data-jump]").forEach(el => {
          el.addEventListener("click", () => {
            const target = el.getAttribute("data-jump");
            AppState.currentView = target;
            renderDrawerMenu();
            renderWorkspaceView(target);
          });
        });

        // Quick action button on dashboard
        const btnQuick = document.getElementById("btnQuickActionMain");
        if (btnQuick) {
          btnQuick.addEventListener("click", () => {
            if (AppState.role === "doctor") {
              AppState.currentView = "opd-pad";
            } else if (AppState.role === "farmer") {
              AppState.currentView = "milk-ledger";
            } else {
              AppState.currentView = "bank-accounts";
            }
            renderDrawerMenu();
            renderWorkspaceView(AppState.currentView);
          });
        }

        // Shaeffer Calculator Runner
        const btnRunCalc = document.getElementById("btnRunWeightCalc");
        if (btnRunCalc) {
          btnRunCalc.addEventListener("click", () => {
            const l = parseFloat(document.getElementById("calcInpLength")?.value || 0);
            const g = parseFloat(document.getElementById("calcInpGirth")?.value || 0);
            const wt = (l * (g * g)) / 300;
            const resEl = document.getElementById("calcWeightVal");
            if (resEl) {
              resEl.innerHTML = wt.toFixed(1) + ' <span class="text-xs font-bold text-slate-600">किलोग्राम (Kg)</span>';
            }
            showToast(`वजन परिकलित: ${wt.toFixed(1)} Kg`, "success");
          });
        }

        // Milk Calculator Runner
        const btnCalcMilk = document.getElementById("btnCalcMilk");
        if (btnCalcMilk) {
          btnCalcMilk.addEventListener("click", () => {
            const ltr = parseFloat(document.getElementById("milkLiters")?.value || 0);
            const fat = parseFloat(document.getElementById("milkFat")?.value || 0);
            const rate = parseFloat(document.getElementById("milkRate")?.value || 0);
            const total = ltr * (fat * rate);
            const outEl = document.getElementById("milkTotalVal");
            if (outEl) {
              outEl.textContent = `₹ ${total.toFixed(2)}`;
            }
            showToast(`कुल राशि सहेजी गई: ₹ ${total.toFixed(2)}`, "success");
          });
        }

        // OPD Save Button
        const btnSaveOpd = document.getElementById("btnSaveOpd");
        if (btnSaveOpd) {
          btnSaveOpd.addEventListener("click", () => {
            const isPreg = document.getElementById("opdPregnancy")?.value === "yes";
            if (isPreg) {
              showToast("चेतावनी: गर्भवती पशु! स्टेरॉयड अवरुद्ध हैं। पर्ची सुरक्षित है।", "success");
            } else {
              showToast("पर्ची सुरक्षित सहेजी गई व कतार में दर्ज हुई।", "success");
            }
          });
        }
      }

      // Language Switcher Handler
      const langSelector = document.getElementById("langSelector");
      if (langSelector) {
        langSelector.addEventListener("change", function () {
          AppState.lang = this.value;
          const t = I18N_CATALOG[AppState.lang] || I18N_CATALOG.hinglish;
          document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (t[key]) el.textContent = t[key];
          });
          renderDrawerMenu();
          renderWorkspaceView(AppState.currentView);
          showToast(`भाषा: ${this.options[this.selectedIndex].text}`, "info");
        });
      }

      // Brand Logo click -> Home
      const brandLogo = document.getElementById("headerBrandHome");
      if (brandLogo) {
        brandLogo.addEventListener("click", () => {
          AppState.currentView = "dashboard";
          renderDrawerMenu();
          renderWorkspaceView("dashboard");
        });
      }

      // Profile avatar button click -> Open drawer
      const btnHeaderProfile = document.getElementById("btnHeaderProfile");
      if (btnHeaderProfile) {
        btnHeaderProfile.addEventListener("click", openDrawer);
      }

      // Logout button
      const btnLogout = document.getElementById("btnLogout");
      if (btnLogout) {
        btnLogout.addEventListener("click", () => {
          showToast("लॉगआउट सफल। सुरक्षित सत्र बंद हुआ।", "info");
          closeDrawer();
        });
      }

      // Initial Mount
      document.addEventListener("DOMContentLoaded", () => {
        renderDrawerMenu();
        renderWorkspaceView("dashboard");
      });
    })();
  </script>
